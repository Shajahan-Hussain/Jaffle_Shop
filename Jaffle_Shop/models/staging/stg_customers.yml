version: 2
 
models:
  - name: stg_customers
    description: "Customer data with basic cleaning and transformation applied, one row per customer."
    columns:
      - name: customer_id
        description: "The unique key for each customer."
        tests:
          - not_null
          - unique
 
      - name: customer_name
        description: "Customer name."
        tests:
          - not_null
 
    tests:
      - cdc_inserts:
          source_model: "{{ source('ecom','raw_customers') }}"
          staging_model: "{{ ref('stg_customers') }}"
 