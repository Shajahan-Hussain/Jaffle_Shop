version: 2
models:
  - name: stg_orders
    tests:
      - mandatory_fields_check:
            columns:
                - ORDER_ID
                - LOCATION_ID
                - CUSTOMER_ID
                - SUBTOTAL_CENTS
                - TAX_PAID_CENTS
                - ORDER_TOTAL_CENTS
                - SUBTOTAL
                - TAX_PAID
                - ORDER_TOTAL
                - ORDERED_AT
                - ROW_NUM
      - no_duplicates_in_stg:
            columns: ['ORDER_ID', 'CUSTOMER_ID']
      - dbt_utils.expression_is_true:
            expression: order_total - tax_paid = subtotal
      - column_rename_check:
          source_model: "{{ source('ecom', 'raw_orders') }}"
          mappings:
            id: order_id
            store_id: location_id
    columns:
      - name: order_id
        tests:
          - not_null
          - unique