version: 2
models:
  - name: order_items
    description: Items contained in each order (one row per order item).
    tests:
         - table_exist_check:
             schema_name: "MARTS"
             table_name: "ORDER_ITEMS"
             tags : ['ADOPIPE']
             meta:
              ado_test_name: "Validate MART - Order Items table exist check"
    columns:
      - name: order_item_id
        description: Unique identifier for the order item.
        tests:
          - not_null
          - unique

      - name: order_id
        description: Foreign key referencing the orders table.
        tests:
          - relationships:
              to: ref('orders')
              field: order_id
