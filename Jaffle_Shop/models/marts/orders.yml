version: 2
models:
  - name: orders
    tests:
         - table_exist_check:
             schema_name: "MARTS"
             table_name: "ORDERS"
             database_name: "{{ target.database }}"  # pass target database
             metadata_table_name: TABLES            # usually TABLES
             tags : ['ADO']
             meta:
              ado_test_name: "To verify whether orders table exists in the Mart schema under target database"
              #schema_chk - changed for Demo
    
     # - dbt_utils.expression_is_true:  #core business logic check
         #       expression: order_items_subtotal = subtotal
         - dbt_utils.expression_is_true: #core business logic check ##core business logic check #Formula KPI Validation
                expression: order_total = subtotal + tax_paid 
         - dbt_utils.equal_rowcount:
                compare_model: ref('stg_orders')  #consistency with staging #Data Integrity KPI Validation
         - dbt_utils.expression_is_true: #Ensures no record has a future timestamp.
                expression: last_updated_at <= current_timestamp 
         - dbt_utils.expression_is_true: #Ensures last_updated_at is never earlier than the order date
             expression: last_updated_at >= ordered_at
          # Join Validation 
         - join_validation:
          #args:
            compare_model: ref('stg_order_items')
            join_key: "order_id"
            key_alias: order_key
            meta:
              ado_test_name: "Join Validation Test-Validate Join Key Validation between orders and order_items table"
            #config:
             #severity: warn
             #warn_if: ">400"
            tags: ['ADO'] #QA tag- changed for demo
         - incremental_update:
            source_table: "{{ ref('stg_orders') }}"
            key_column: order_id
            business_columns: subtotal,tax_paid,customer_id
            key_alias: order_id
            prev_timestamp: "2025-09-24 03:28:12.615 -0700"
            created_col: created_at
            ref_col: ordered_at
            updated_at_col: last_updated_at
            #severity: warn
         - incremental_data_drift:
            compare_model: ref('stg_orders')
            unique_key: order_id
            updated_at: last_updated_at
            src_updated_at: ordered_at
        
    columns:
      - name: customer_id
        tests:
          - relationships: # FK check: all customers must exist in stg_customers
                to: ref('stg_customers')
                field: customer_id
      - name: order_id
        tests:          
          - not_null   # PK check
          - unique     # PK check
          - incremental_freshness:
              compare_model: ref('stg_orders')
              column_name: last_updated_at
              severity: warn
              tags: ['QA']
         # - custom_test_updated_records_not_reflected  #commented (macro missing)
