version: 2
models:
  - name: stg_supplies
    tests:
      - supply_cost_check:
            description: "supply cost check in Supplies TABLE"
            tags: ['QA']
            raw_table: "{{ source('ecom','raw_supplies') }}"
            key_column: id
            key_col_model: supply_id
            raw_cost_col: cost
            staging_cost_col: supply_cost
    description: >
      List of our supply expenses data with basic cleaning and transformation applied.

      One row per supply cost, not per supply. As supply costs fluctuate they receive a new row with a new UUID. Thus there can be multiple rows per supply_id.
    columns:
      - name: supply_uuid
        description: The unique key of our supplies per cost.
        data_tests:
          - not_null:
             tags: ['Not_null']
          - unique:
             tags: ['Unique']
