config-version: 2

name: "Jaffle_Shop"
version: "3.0.0"
require-dbt-version: ">=1.5.0"

profile: jaffle_shop

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  "dbt_date:time_zone": "America/Los_Angeles"
  
on-run-end:
  - "truncate table JAFFLE_SHOP.LOGS.MODELS"
  - "truncate table JAFFLE_SHOP.LOGS.TESTS"
  - "truncate table JAFFLE_SHOP.LOGS.SNAPSHOTS"
  - "truncate table JAFFLE_SHOP.LOGS.SEEDS"
  - "truncate table JAFFLE_SHOP.LOGS.SOURCES"
  - "{{ dbt_artifacts.upload_results(results) }}"

  
seeds:
  Jaffle_Shop:
    +schema: raw
    jaffle-data:
      +enabled: "{{ var('load_source_data', false) }}"

models:
  Jaffle_Shop:
    staging:
      +schema: staging
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
  dbt_artifacts:
    +enabled: false
    sources: 
      +enabled: true
      +schema: logs



